# Deploys `FolioFactory` to Robinhood Chain — mainnet — from CI, using
# repository secrets for the deployer key and the RPC endpoint.
#
# This is `deploy-base-sepolia.yml` for the other chain. Everything structural
# is the same on purpose — same script, same bytecode, same gates — so the two
# files stay readable side by side and a change to one is obvious in the other.
# What differs is listed under "What is different from Base Sepolia" below.
#
# ## This one spends real money
#
# Robinhood Chain (4663) is a mainnet. A run here pays real ETH for gas and
# leaves a factory that real buyers can trade against; there is no faucet and no
# redo. `FOLIO_SKIP_CONFIRM=true` is set below because a workflow has no stdin,
# which means the interactive confirmation every local deploy gets does not
# happen here. Two things stand in for it:
#
#   1. the `robinhood-mainnet` GitHub Environment, which is where required
#      reviewers belong — add them, this is the gate;
#   2. the `confirm` input below, which must be typed exactly.
#
# Deploy to Base Sepolia first. Same script, same bytecode, free ETH; a change
# that has not run there has no business running here.
#
# ## Manual trigger only
#
# There is deliberately no `push` or `schedule` trigger. Re-running this
# workflow deploys a *second, independent* factory and overwrites
# `deployments/robinhood-mainnet.json` — the previous address then survives only
# in git history and in the run's artifact, while the factory it names stays
# live on chain holding whatever reserves it holds. That is a decision a person
# makes, not something a merge to a branch should cause.
#
# ## Required configuration
#
# Secrets, on the `robinhood-mainnet` environment (Settings -> Environments):
#
#   DEPLOYER_PRIVATE_KEY       0x-prefixed 32-byte hex — `vm.envUint` needs the
#                              prefix. This key holds real ETH and ends up
#                              owning the factory's emergency stop, so it is not
#                              the throwaway key the testnet workflows use. Fund
#                              it with the deploy cost and no more.
#   ROBINHOOD_MAINNET_RPC_URL  Resolves the `robinhood-mainnet` alias in
#                              foundry.toml. The public endpoint works and is
#                              rate-limited.
#
# A separate environment from `base-sepolia`, not a shared one, and this is
# where that separation earns itself: environments are where the reviewer list
# lives, and the two chains are not equally consequential to deploy to.
#
# Optional repository variables (Settings -> Variables), all wei:
#
#   FACTORY_VIRTUAL_ETH_RESERVE, FACTORY_MAX_RESERVE_CAP,
#   FACTORY_GRADUATION_THRESHOLD, FACTORY_FEE_BPS, FACTORY_PRICE_MOVE_ALERT_BPS
#
# Unset, these fall back to the script's defaults — 2 ETH virtual reserve, 5 ETH
# cap, graduation at 4 ETH — which were chosen when every supported chain handed
# out its ETH for free. On this chain they are real amounts. Set them.
#
# ## What is different from Base Sepolia
#
# 1. **Verification goes through Blockscout, not Etherscan.** Robinhood Chain is
#    not on Etherscan's v2 API at all, so `--verify` alone verifies nothing:
#    `--verifier blockscout` selects the provider and `--verifier-url` points at
#    this chain's instance, `/api/` suffix included. `foundry.toml` already
#    carries that URL under `[etherscan] robinhood-mainnet`, but the *provider*
#    is a command-line choice, which is why the flags are still here.
#
# 2. **No API key is required to verify.** Blockscout does not ask for one, so
#    unlike `BASESCAN_API_KEY` there is no secret to check before turning
#    verification on. `BLOCKSCOUT_API_KEY` exists in `.env.example` only because
#    foundry.toml wants the field, and this workflow never reads it.
#
# 3. **The RPC URL is checked against the chain before anything is signed.** A
#    secret that answers HTML instead of JSON-RPC, or that points at the testnet,
#    is invisible until a run fails somewhere confusing — or, worse here, until
#    it succeeds against the wrong chain. See the preflight step.
#
# ## The network guard still applies
#
# `FolioScript.onlySupportedNetwork` reverts on any chain id without a
# `NetworkProfile` during the local simulation, before anything is signed. A
# wrong RPC URL in the secret fails the run rather than deploying somewhere
# nobody chose. The preflight below is not a replacement for that guard — it is
# there to fail in one readable line instead of inside a simulation trace.

name: Deploy — Robinhood Chain (mainnet)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy to mainnet' to confirm real funds are being spent"
        type: string
        required: true
      verify:
        description: "Verify the contracts on Blockscout"
        type: boolean
        default: true
      commit_record:
        description: "Commit deployments/robinhood-mainnet.json back to this branch"
        type: boolean
        default: true
      factory_owner:
        description: "Owner of the emergency stop (blank = the deployer)"
        type: string
        required: false

permissions: {}

# Never cancel a run that may already have broadcast a transaction: the record
# of what was deployed is written after the broadcast returns.
concurrency:
  group: deploy-robinhood-mainnet
  cancel-in-progress: false

env:
  # One definition, used by the deploy step and by the preflight that checks the
  # chain answers to it. 4663 is Robinhood Chain mainnet; 46630 is its testnet,
  # and the two are one keystroke apart, which is the whole reason the preflight
  # compares against this rather than trusting the secret's name.
  EXPECTED_CHAIN_ID: "4663"
  EXPLORER: "https://robinhoodchain.blockscout.com"

jobs:
  deploy:
    name: Deploy FolioFactory
    runs-on: ubuntu-latest
    # Gate approvals and scope the secrets. Add required reviewers here: with
    # FOLIO_SKIP_CONFIRM set, this is the human gate on a mainnet broadcast.
    environment: robinhood-mainnet
    permissions:
      # Only for the commit-back step. Everything else is read-only.
      contents: write

    steps:
      # First, before the checkout even: a mistyped confirmation should cost
      # nothing but a few seconds.
      - name: Confirm intent
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "deploy to mainnet" ]; then
            echo "The confirmation input must read exactly: deploy to mainnet" >&2
            echo "Got: '${CONFIRM}'. Nothing was signed." >&2
            exit 1
          fi
          echo "Confirmed — deploying to Robinhood Chain mainnet (4663)."

      # `submodules: recursive` pulls contracts/lib/forge-std, which the
      # remappings in foundry.toml point at.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # OpenZeppelin resolves through node_modules — foundry.toml lists it in
      # `libs` and remaps @openzeppelin/* into it — so the contracts do not
      # build without an npm install.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Fails with a readable message instead of letting `forge` report a
      # missing env var or an unresolvable RPC alias several minutes in.
      #
      # Two secrets, not three: Blockscout verification needs no API key, so
      # `verify` adds no requirement here the way it does on Base Sepolia.
      - name: Check required secrets
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ROBINHOOD_MAINNET_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_RPC_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${DEPLOYER_PRIVATE_KEY}" ] || missing+=("DEPLOYER_PRIVATE_KEY")
          [ -n "${ROBINHOOD_MAINNET_RPC_URL}" ] || missing+=("ROBINHOOD_MAINNET_RPC_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing secret: %s\n' "${missing[@]}" >&2
            echo "Set them on the 'robinhood-mainnet' environment." >&2
            exit 1
          fi
          case "${DEPLOYER_PRIVATE_KEY}" in
            0x*) ;;
            *) echo "DEPLOYER_PRIVATE_KEY must be 0x-prefixed — vm.envUint cannot parse it otherwise." >&2; exit 1 ;;
          esac

      # The endpoint is asked what chain it is before the deploy asks it to sign
      # anything. A URL that answers HTML, 404s, or belongs to another chain —
      # the testnet included — fails here, in one line naming what it answered,
      # rather than inside a simulation trace. The RPC URL itself is never
      # printed: it may carry an API key.
      - name: Preflight — the RPC is the chain it claims to be
        env:
          ROBINHOOD_MAINNET_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_RPC_URL }}
        run: |
          set -euo pipefail
          if ! actual="$(cast chain-id --rpc-url "${ROBINHOOD_MAINNET_RPC_URL}" 2>&1)"; then
            echo "The RPC endpoint did not answer a chain id:" >&2
            echo "${actual}" >&2
            exit 1
          fi
          if [ "${actual}" != "${EXPECTED_CHAIN_ID}" ]; then
            echo "ROBINHOOD_MAINNET_RPC_URL is chain ${actual}, expected ${EXPECTED_CHAIN_ID}." >&2
            echo "Nothing was signed. Fix the secret on the 'robinhood-mainnet' environment." >&2
            exit 1
          fi
          echo "Chain id ${actual} — Robinhood Chain mainnet."

      - name: Build
        run: forge build

      # The contracts that are about to hold real ETH get the same gate as a
      # pull request. Cheap next to a broadcast, and the only check between a
      # bad commit and a deployed factory.
      - name: Test
        run: forge test

      # Only non-empty values are exported. Setting FACTORY_FEE_BPS to an empty
      # string is not the same as leaving it unset: `vm.envOr` returns its
      # default only for the latter, and fails to parse the former.
      #
      # The defaults being inherited here are testnet-shaped. What this step
      # prints is the last chance to notice that before the broadcast.
      - name: Assemble factory configuration
        env:
          FACTORY_OWNER: ${{ inputs.factory_owner }}
          FACTORY_VIRTUAL_ETH_RESERVE: ${{ vars.FACTORY_VIRTUAL_ETH_RESERVE }}
          FACTORY_MAX_RESERVE_CAP: ${{ vars.FACTORY_MAX_RESERVE_CAP }}
          FACTORY_GRADUATION_THRESHOLD: ${{ vars.FACTORY_GRADUATION_THRESHOLD }}
          FACTORY_FEE_BPS: ${{ vars.FACTORY_FEE_BPS }}
          FACTORY_PRICE_MOVE_ALERT_BPS: ${{ vars.FACTORY_PRICE_MOVE_ALERT_BPS }}
        run: |
          set -euo pipefail
          for name in FACTORY_OWNER \
                      FACTORY_VIRTUAL_ETH_RESERVE \
                      FACTORY_MAX_RESERVE_CAP \
                      FACTORY_GRADUATION_THRESHOLD \
                      FACTORY_FEE_BPS \
                      FACTORY_PRICE_MOVE_ALERT_BPS; do
            value="${!name-}"
            if [ -n "${value}" ]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
              echo "Overriding ${name}=${value}"
            else
              echo "${name} not set — the script's default applies."
            fi
          done

      # Fingerprint the record before the deploy, so the steps below can tell a
      # freshly written file from one that was already committed. The record for
      # this chain is committed with empty addresses before its first deploy, so
      # "the file exists" never meant "a factory exists" here.
      - name: Fingerprint existing deployment record
        run: |
          set -euo pipefail
          if [ -f deployments/robinhood-mainnet.json ]; then
            echo "RECORD_HASH_BEFORE=$(sha256sum deployments/robinhood-mainnet.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          else
            echo "RECORD_HASH_BEFORE=none" >> "$GITHUB_ENV"
          fi

      # `continue-on-error` so that a failure *after* the broadcast — most
      # likely verification, which is routinely flaky — cannot discard the
      # record of a factory that now exists on chain. The job is still failed,
      # at the last step, once the record has been saved.
      - name: Deploy
        id: deploy
        continue-on-error: true
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ROBINHOOD_MAINNET_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_RPC_URL }}
          # `confirm()` blocks on `vm.prompt` otherwise, and a workflow has no
          # stdin — the run would hang until it timed out. The environment's
          # reviewers and the `confirm` input are what replace it here.
          FOLIO_SKIP_CONFIRM: "true"
        run: |
          set -euo pipefail
          verify_flags=()
          if [ "${{ inputs.verify }}" = "true" ]; then
            verify_flags=(--verify --verifier blockscout --verifier-url "${EXPLORER}/api/")
          fi
          forge script contracts/script/DeployFactory.s.sol:DeployFactory \
            --rpc-url robinhood-mainnet \
            --broadcast \
            "${verify_flags[@]}" \
            -vvv

      - name: Read deployment record
        id: record
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f deployments/robinhood-mainnet.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No deployment record was written."
            exit 0
          fi
          after="$(sha256sum deployments/robinhood-mainnet.json | cut -d' ' -f1)"
          if [ "${after}" = "${RECORD_HASH_BEFORE:-none}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Deployment record is unchanged — this run deployed nothing."
            exit 0
          fi
          {
            echo "changed=true"
            echo "factory=$(jq -r .factory deployments/robinhood-mainnet.json)"
            echo "implementation=$(jq -r .implementation deployments/robinhood-mainnet.json)"
          } >> "$GITHUB_OUTPUT"

      # Kept even on failure: if the broadcast landed but a later step did not,
      # this artifact is the only copy of the address outside the explorer.
      - name: Upload deployment record
        if: always() && steps.record.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: robinhood-mainnet-deployment-${{ github.run_id }}
          path: |
            deployments/robinhood-mainnet.json
            broadcast/
          if-no-files-found: warn

      - name: Summary
        if: always() && steps.record.outputs.changed == 'true'
        env:
          FACTORY: ${{ steps.record.outputs.factory }}
          IMPLEMENTATION: ${{ steps.record.outputs.implementation }}
        run: |
          set -euo pipefail
          {
            echo "## FolioFactory deployed to Robinhood Chain (mainnet)"
            echo
            echo "| | Address | Blockscout |"
            echo "|---|---|---|"
            echo "| Factory | \`${FACTORY}\` | [view](${EXPLORER}/address/${FACTORY}) |"
            echo "| Implementation | \`${IMPLEMENTATION}\` | [view](${EXPLORER}/address/${IMPLEMENTATION}) |"
            echo
            if [ "${{ steps.deploy.outcome }}" != "success" ]; then
              echo "> The deploy step failed *after* broadcasting. The contracts above exist"
              echo "> on chain; check the log for whether Blockscout verification is what failed,"
              echo "> and if so re-run it with \`forge verify-contract --verifier blockscout\`."
              echo
            fi
            echo "### deployments/robinhood-mainnet.json"
            echo
            echo '```json'
            cat deployments/robinhood-mainnet.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The record is committed so the frontend and the interaction scripts read
      # the same address. This is a *second* record, not a replacement: the Base
      # Sepolia file is untouched and its factory keeps running. Skipped when the
      # branch is protected — push the record yourself from the artifact then.
      - name: Commit deployment record
        if: |
          always()
          && steps.record.outputs.changed == 'true'
          && inputs.commit_record
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/robinhood-mainnet.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: record Robinhood Chain factory ${{ steps.record.outputs.factory }}"
          if ! git push origin "HEAD:${{ github.ref_name }}"; then
            echo "::warning::Could not push the deployment record to ${{ github.ref_name }} — the branch is likely protected. Download it from this run's artifact and commit it manually."
          fi

      # Last, so that everything above has already run. Without this the job
      # would report success on a run whose deploy step failed.
      - name: Report deploy status
        if: always() && steps.deploy.outcome != 'success'
        run: |
          echo "The deploy step failed — see its log above." >&2
          exit 1
