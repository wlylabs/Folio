<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The favicon, picked up by Next's app/icon.* file convention — no <link>
    tag anywhere, the framework emits it.

    Same mark as components/Logo.tsx, drawn heavier and larger in the frame:
    a tab icon renders at 16px against browser chrome, where the component's
    hairlines would disappear. It carries its own paper square rather than
    inheriting a page's, so it stays legible on light and dark chrome alike.
  -->
  <rect width="32" height="32" fill="#f7f6f2"/>
  <g fill="none" stroke="#14120e" stroke-linecap="butt">
    <rect x="6.5" y="4" width="19" height="24" stroke-width="2.5"/>
    <path d="M16 4V28" stroke-width="3.5"/>
  </g>
</svg>
