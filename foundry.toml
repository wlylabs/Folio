[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["contracts/lib", "node_modules"]
cache_path = "contracts/cache"
# The deploy script records the factory address in `deployments/`, and every
# interaction script reads it back from there instead of taking an address on
# the command line. Scoped to that one directory: scripts get no other reach
# into the filesystem.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# Paris, not Cancun: no PUSH0, no transient storage, no MCOPY. The contracts have
# to run unmodified on Robinhood Chain, whose EVM revision isn't known yet, and
# nothing here needs a post-Merge opcode.
evm_version = "paris"
remappings = [
  "forge-std/=contracts/lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
]

[profile.default.fuzz]
runs = 512

# The handler in `test/helpers/FolioHandler.sol` filters its own preconditions
# and never reverts, so `fail_on_revert` can stay on — which is what makes an
# unexpected revert a failure rather than a run the fuzzer quietly discards.
[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true
shrink_run_limit = 5000

# `forge test --profile deep` before a release: same suites, far more sequences.
[profile.deep.fuzz]
runs = 10_000

[profile.deep.invariant]
runs = 2_000
depth = 256
fail_on_revert = true

# Base Sepolia and nothing else. There is deliberately no mainnet alias in this
# file — not for Base, not for Ethereum — so `--rpc-url base-sepolia` is the only
# named network that resolves. The scripts enforce the same rule at runtime by
# reverting on any chain id other than 84532, so a hand-typed `--rpc-url` cannot
# route a deploy somewhere real either.
[rpc_endpoints]
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"

# `chain = 84532` pins verification to Base Sepolia on Etherscan's v2 API, which
# is what Basescan now serves. One key covers every v2 chain, so the key itself
# is not what keeps this on testnet — the chain id is.
[etherscan]
base-sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[fmt]
line_length = 100
tab_width = 4
