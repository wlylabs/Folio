[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["contracts/lib", "node_modules"]
cache_path = "contracts/cache"
# The deploy script records the factory address in `deployments/`, and every
# interaction script reads it back from there instead of taking an address on
# the command line. Scoped to that one directory: scripts get no other reach
# into the filesystem.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# Paris, not Cancun: no PUSH0, no transient storage, no MCOPY. The target chain
# almost certainly accepts Shanghai and Cancun opcodes — Robinhood Chain is
# Arbitrum Orbit, and Arbitrum has had PUSH0 since ArbOS 11 and TSTORE/MCOPY
# since ArbOS 20 — but "almost certainly" is doing real work in that sentence
# and paris makes it unnecessary. What it costs was measured, not assumed:
# building at cancun instead saves ~63k gas on the one-off factory deploy
# (2,835,297 -> 2,772,093, 2.2%) and under 0.4% on every trade — 22,896 -> 22,819
# on a warm buy, 20,923 -> 20,847 on a partial sale. That is not worth a
# revision assumption on a chain we have not deployed to yet. Revisit once a
# deploy has actually landed and the explorer confirms what the chain runs.
evm_version = "paris"
remappings = [
  "forge-std/=contracts/lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
]

[profile.default.fuzz]
runs = 512

# The handler in `test/helpers/FolioHandler.sol` filters its own preconditions
# and never reverts, so `fail_on_revert` can stay on — which is what makes an
# unexpected revert a failure rather than a run the fuzzer quietly discards.
[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true
shrink_run_limit = 5000

# `forge test --profile deep` before a release: same suites, far more sequences.
[profile.deep.fuzz]
runs = 10_000

[profile.deep.invariant]
runs = 2_000
depth = 256
fail_on_revert = true

# One chain and nothing else.
#
#   robinhood-mainnet   4663   Robinhood Chain, real ETH, where Folio launches
#
# This one costs money to get wrong. There is no testnet alias any more — Base
# Sepolia was removed rather than left as a second, quieter way to be pointed at
# the wrong network — and no alias for anything else either, so nothing here
# names a network nobody chose. Rehearse against a local fork instead:
# `anvil --fork-url $ROBINHOOD_MAINNET_RPC_URL`, then `--rpc-url
# http://127.0.0.1:8545`, which keeps chain id 4663 and so passes the guard.
#
# The scripts enforce the same list at runtime:
# `FolioScript.onlySupportedNetwork` reverts on any chain id without a
# `NetworkProfile`, so a hand-typed `--rpc-url` cannot route a deploy somewhere
# unlisted either. Adding a chain means adding it in both places.
#
# The alias name matches the `deployments/<alias>.json` stem, so `--rpc-url
# robinhood-mainnet` and `deployments/robinhood-mainnet.json` cannot drift.
[rpc_endpoints]
robinhood-mainnet = "${ROBINHOOD_MAINNET_RPC_URL}"

# Verification.
#
# Robinhood Chain's explorer is Blockscout, which is not on Etherscan's v2 API
# at all: it serves an Etherscan-compatible endpoint at its own `/api`, and the
# `url` below is what points Foundry there instead. Blockscout does not require
# an API key for verification, so `BLOCKSCOUT_API_KEY` is normally empty and
# exists only because Foundry wants the field.
#
# This table sets *where* to verify, not *how*. Foundry's default verifier is
# still Etherscan, so a Robinhood deploy needs `--verifier blockscout` on the
# command line as well — see DEPLOYMENT.md for the full command.
[etherscan]
robinhood-mainnet = { key = "${BLOCKSCOUT_API_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }

[fmt]
line_length = 100
tab_width = 4
