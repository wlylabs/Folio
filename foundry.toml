[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
libs = ["contracts/lib", "node_modules"]
cache_path = "contracts/cache"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# Paris, not Cancun: no PUSH0, no transient storage, no MCOPY. The contracts have
# to run unmodified on Robinhood Chain, whose EVM revision isn't known yet, and
# nothing here needs a post-Merge opcode.
evm_version = "paris"
remappings = [
  "forge-std/=contracts/lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
]

[profile.default.fuzz]
runs = 512

# The handler in `test/helpers/FolioHandler.sol` filters its own preconditions
# and never reverts, so `fail_on_revert` can stay on — which is what makes an
# unexpected revert a failure rather than a run the fuzzer quietly discards.
[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true
shrink_run_limit = 5000

# `forge test --profile deep` before a release: same suites, far more sequences.
[profile.deep.fuzz]
runs = 10_000

[profile.deep.invariant]
runs = 2_000
depth = 256
fail_on_revert = true

[fmt]
line_length = 100
tab_width = 4
